<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Communify</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css?family=Raleway&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="preloader" aria-hidden="true">
      <div class="loader" role="status" aria-label="Loading"></div>
    </div>
    <div class="mobile-bg" aria-hidden="true"></div>
    <main class="mobile-shell">
      <p class="brand">COMMUNIFY</p>
      <section class="mobile-card" aria-labelledby="mobile-title">
        <h1 id="mobile-title">Desktop only</h1>
        <p>
          Communify is built for PC gamers. Please open
          <strong>comm-unify.netlify.app</strong> on a desktop or laptop for
          the full experience.
        </p>
      </section>
    </main>
    <script src="index.js"></script>
  </body>
</html>
